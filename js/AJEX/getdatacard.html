<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <button onclick="getData()">getData</button>

    <div id="data" class="row">

    </div>


    <script>
        function getData() {
            let xhr = new XMLHttpRequest();

            xhr.open("GET", "https://dummyjson.com/carts")

            xhr.onload = function () {
                console.log(xhr)

                if (xhr.status === 200) {
                    let user = xhr.responseText;
                    console.log(user)

                    let data = JSON.parse(user);


                    var udata = ``
                    for (let index of data.carts) {

                        udata +=
                            `
         <div class="col-md-4 mb-3 ">
        <div class="card">
            <img src="${index.products[0].thumbnail}" alt="Product Image" >
            
    <div class="card-body">
        <h5 class="card-title"><b>Id</b> : ${index.id}</h5>
        <h4 class="card-title"><b>Title</b> : ${index.products[0].title}</h5>
        <p class="card-text"><b>Product</b> : ${index.totalProducts}</p>
        <p class="card-text"><b>Quantity</b> : ${index.totalQuantity}</p>
        <p class="card-text"><b>Total</b> : ${index.total}</p>
    </div>
    </div>
    </div>`
   
                  }

                    udata += " "
                    document.getElementById("data").innerHTML = udata;

                } else {

                   let  errocode = `404 page not found`;

                    document.getElementById("data").innerHTML = errocode;
                }
            }

            xhr.send()
        }
    </script>

</body>

</html>
