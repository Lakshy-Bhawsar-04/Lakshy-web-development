<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataType in js </title>
</head>
<body>

    <script>
     // Number: Represents both integer and floating-point 
     var a = 23;
     console.log("Value of a:",a);
     console.log("DataType of a:" ,typeof a)

     var a1 = 2.4;
     console.log("value of a1",a1)
     console.log("DataType of a1:" ,typeof a1)

     //String:  Represents a sequence of characters.
     let str = "Lakshy Bhawsar";
     console.log("Value of str:",str);
     console.log("DataType of str:",typeof str);

    //Boolean: Represents logical values: true or false.
     let b = true;
     console.log("Value of b:",b);
     console.log("DataType of b:",typeof b);

     // Undefined: Represents a variable that has been declared but not assigned a value.

     let undf;
     console.log("Value of undf:",undf);
     console.log("DataType of undf:",typeof undf);

     // Symbol: Represents a unique and immutable identifier.
     let sym = Symbol("$");
     console.log("Value of sym:",sym);
     console.log("DataType of sym:",typeof sym);
     
     //BigInt : Represents integers with arbitrary precision.
     let bigValue = 5163479084316466436647463742674673483873785475348584582875832587358485694868947984798759869498634986892536798234253537557123423532n;
     console.log("value of bigValue :" ,bigValue);
     console.log("DataType of bigValue:",typeof bigValue);
 
    


    </script>
</body>
</html>
