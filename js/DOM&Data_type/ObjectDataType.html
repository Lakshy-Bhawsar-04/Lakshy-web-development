<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object data type</title>
</head>

<body>
    <script>
        // Object data type
        // Object
        let udata = {
            id: 10002,
            name: "lakshy Bhawsar",
            address: "Indore",
            mobile: 3433543243,
            age: 19
        };

        console.log(udata);
        console.log(udata.mobile)
        console.log(typeof udata)

        // array
        let arr = [565656 ,"Lakshy Bhawsar","Indore",5644354534 ];
        console.log(arr)
        console.log(arr[3]);
        console.log(typeof arr);

        //function DataType
        let add=(a,b)=>{return a+b};
        console.log(add(34,2));
        console.log(typeof add)

        // Data 
        let d = new Date();
        console.log(d)
        console.log(typeof d)

        // Regular expressions
        let regex = /^[A-Za-z0-9\s]+$]/
        console.log(regex)
        console.log(typeof regex)

        // Null

        let e = null;
        console.log("value of e = ",e);
        console.log(typeof e);

    </script>
</body>

</html>
