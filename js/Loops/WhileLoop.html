<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While loop in js</title>
    <style>
        .tb1{
            font-size: 34px;
            font-weight: bold;
            text-shadow: 1px 1px black;
        }
        .red{
            color:red;
        }
        .green{
            color:green;
        }
        .blue{
            color:blue;
        }
    </style>
</head>
<body>
     <input type="number" id="num" placeholder="Enter any number" onkeyup="showTable()">

     <ul id="showTable"></ul>

     <script>
        function showTable(){
            num= document.getElementById("num").value;
            console.log(num);
            if(num==" "){
                tableData = ``;
            }
            else{
                let i=1;
                tableData="";
                while(i<=10){
                    tableData+=`<li class="tb1"><span class="red">${num}</span>x<span class="green">${i}</span>=<span class="blue">${num*i}</span></li>`;
                    i++;
                }
            }
            document.getElementById("showTable").innerHTML=tableData;
        }
     </script>

</body>
</html>
